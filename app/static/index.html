<style>
:root{
  --bg:#f4f1ec; --panel:#ffffff; --panel2:#faf8f4; --ink:#1d1a16; --muted:#6f685e; --line:#e3ddd3;
  --accent:#c47d12; --accent-ink:#ffffff; --accent-soft:#f6e7cf; --ok:#2f7d4f; --warn:#b4541b; --err:#b42d2d;
  --meter-bg:#ece7de; --meter:#3d8a5b; --meter-hot:#d08a1a; --meter-clip:#c43b3b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --panel:#1e1b16; --panel2:#24201a; --ink:#efe9df; --muted:#a59c8e;
    --line:#352f27; --accent:#e8a33d; --accent-ink:#181410; --accent-soft:#3a2d17; --ok:#5fbf85; --warn:#e58b4a; --err:#ef6b6b;
    --meter-bg:#2c2720; --meter:#5fbf85; --meter-hot:#e8a33d; --meter-clip:#ef6b6b; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --panel:#1e1b16; --panel2:#24201a; --ink:#efe9df; --muted:#a59c8e;
  --line:#352f27; --accent:#e8a33d; --accent-ink:#181410; --accent-soft:#3a2d17; --ok:#5fbf85; --warn:#e58b4a; --err:#ef6b6b;
  --meter-bg:#2c2720; --meter:#5fbf85; --meter-hot:#e8a33d; --meter-clip:#ef6b6b; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:38px;height:38px;flex:none;display:block}
header h1{font-size:18px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px 20px;max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
.card>h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:47px}
.card>h2 .sp{flex:1}
.card>h2 .btn,.card>h2 select{text-transform:none;letter-spacing:0}
.body{padding:14px 16px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.crumbs a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumbs span{color:var(--muted)}
.list{max-height:calc(100vh - 210px);overflow:auto}
@media (max-width:900px){.list{max-height:340px}}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--accent-soft)}
.item .ic{width:20px;text-align:center;opacity:.8;flex:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sz{color:var(--muted);font-size:12px;flex:none}
.item .more{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center}
.item .more:hover,.item .more.on{border-color:var(--line);background:var(--panel);color:var(--ink)}
.fmenu{position:fixed;z-index:20;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:5px}
.fmenu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.fmenu button:hover{background:var(--panel2)}
.fmenu button.del{color:var(--err)}
.fmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1200px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input[type=text],input[type=search]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input[type=text],.row>input[type=search]{flex:1;min-width:160px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0;cursor:pointer}
.chk input{margin-top:3px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{color:var(--warn)} .err{color:var(--err)} .ok{color:var(--ok)}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--panel2)}
.box.warnbox{border-color:var(--warn)}
/* stanza 5.1 */
.room{position:relative;border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--panel2)}
.stage{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.spk-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"fl fc fr" "sl lfe sr";gap:14px 10px;margin-top:14px}
.spk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.spk .tag{font-weight:700;font-size:13px}
.spk .lbl{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;min-height:26px}
.spk .val{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.vs{writing-mode:vertical-lr;direction:rtl;width:28px;height:150px;accent-color:var(--accent);cursor:pointer}
@media (max-width:520px){.vs{height:110px}}
.link{font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.link label{display:flex;gap:4px;align-items:center;cursor:pointer}
.adv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px}
.hs label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 2px}
.hs label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hs input{width:100%;accent-color:var(--accent)}
/* meter */
.meters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.mt{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.bar{position:relative;width:18px;height:110px;background:var(--meter-bg);border-radius:4px;overflow:hidden}
.bar .r{position:absolute;bottom:0;left:0;right:0;background:var(--meter)}
.bar .p{position:absolute;left:0;right:0;height:2px;background:var(--meter-hot)}
.mt .n{font-weight:700}
.mt .d{color:var(--muted);font-variant-numeric:tabular-nums}
audio{width:100%;margin-top:10px}
/* pianta della stanza 5.1 */
#prevCard{display:flex;flex-direction:column}
#prevCard>.body{flex:1;display:flex;flex-direction:column}
.room-viz{flex:1;display:flex;align-items:center;justify-content:center;margin-top:14px;min-height:300px}
.room-viz svg{width:100%;max-width:520px;height:auto;display:block}
.rv-floor{fill:var(--panel2);stroke:var(--line)}
.rv-ring{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.rv-tv{fill:var(--ink);opacity:.8}
.rv-beam{fill:var(--accent);transition:opacity .15s}
.rv-body{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.rv-drv{fill:var(--muted)}
.rv-drv.on{fill:var(--accent)}
.rv-pill{fill:var(--panel);stroke:var(--accent);stroke-width:1.3}
.rv-pill.low{stroke:var(--line)}
.rv-tag{fill:var(--muted);font:700 11px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.rv-val{fill:var(--ink);font:600 12.5px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.rv-ang{fill:var(--muted);font:11px system-ui,sans-serif;text-anchor:middle}
.rv-sofa{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.rv-head{fill:var(--accent)}
.rv-lbl{fill:var(--muted);font:12px system-ui,sans-serif;text-anchor:middle}
/* copertine */
.cover-sel{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.cover-sel img{width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--meter-bg);flex:none}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:12px;max-height:430px;overflow:auto;padding:2px}
.cv{border:2px solid transparent;border-radius:10px;background:var(--panel2);cursor:pointer;padding:6px;font-size:12px;line-height:1.25;text-align:left;color:inherit}
.cv:hover{border-color:var(--line)}
.cv.sel{border-color:var(--accent)}
.cv img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--meter-bg);display:block;margin-bottom:5px}
.cv .ti{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv .ar{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .src{color:var(--muted);font-size:11px;margin-top:2px}
/* lavori */
.job{padding:12px 16px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job .t{display:flex;gap:8px;align-items:center;font-size:14px}
.job .t .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.badge.done{color:var(--ok)} .badge.error{color:var(--err)} .badge.running{color:var(--accent)}
.pb{height:6px;background:var(--meter-bg);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.pb>div{height:100%;background:var(--accent);transition:width .4s}
.job .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
/* dialoghi */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .list{max-height:55vh}
dialog .dh{font-size:16px;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);margin:0;display:flex;align-items:center;gap:8px}
dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:8px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.switch input{width:38px;height:22px;appearance:none;background:var(--meter-bg);border-radius:99px;position:relative;cursor:pointer;flex:none;margin-top:1px;border:1px solid var(--line)}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--warn);border-color:var(--warn)}
.switch input:checked::after{left:18px}
.rootrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.rootrow+.rootrow{border-top:1px solid var(--line)}
.rootrow b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rootrow span{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.rootrow.rw span{color:var(--ok)}
#setDlg{max-height:calc(100vh - 32px)}
#setDlg .body{max-height:calc(100vh - 170px);overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px);z-index:10}
.toast.on{opacity:1}
.placeholder{padding:40px 20px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<main>
  <section>
    <div class="card">
      <h2 data-i18n="sec.source"></h2>
      <div class="crumbs" id="crumbs"></div>
      <div class="list" id="list"></div>
    </div>
  </section>

  <section id="work">
    <div class="card" id="noWritable" hidden><div class="body warn" data-i18n="warn.noWritable"></div></div>
    <div class="card" id="noFile"><div class="placeholder" data-i18n="pick.file"></div></div>

    <div id="panel" hidden>
      <div class="card">
        <h2 data-i18n="sec.file"></h2>
        <div class="body">
          <dl class="kv" id="info"></dl>
          <label class="f" for="track" data-i18n="track.label"></label>
          <select id="track"></select>
          <p class="note" id="trackNote"></p>
        </div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2><span data-i18n="sec.channels"></span><span class="sp"></span>
            <select id="preset" style="width:auto;font-size:13px;padding:4px 8px"></select>
          </h2>
          <div class="body">
            <div class="room">
              <div class="stage">▲ <span data-i18n="stage"></span></div>
              <div class="spk-grid" id="spk"></div>
              <div class="link">
                <label><input type="checkbox" id="linkF" checked> <span data-i18n="link.front"></span></label>
                <label><input type="checkbox" id="linkS" checked> <span data-i18n="link.surr"></span></label>
              </div>
            </div>
            <div class="row" style="margin-top:12px">
              <button class="btn sm" id="resetBtn" data-i18n="btn.resetPreset"></button>
              <button class="btn sm" id="savePresetBtn" data-i18n="btn.savePreset"></button>
              <button class="btn sm" id="delPresetBtn" data-i18n="btn.delPreset" hidden></button>
            </div>
          </div>
        </div>

        <div class="card" id="prevCard">
          <h2 data-i18n="sec.preview"></h2>
          <div class="body">
            <div class="hs"><label><span data-i18n="prev.start"></span> <b id="startV">0:00</b></label>
              <input type="range" id="start" min="0" max="0" step="1" value="0"></div>
            <div class="row" style="margin-top:10px">
              <button class="btn" id="prevBtn" data-i18n="prev.btn"></button>
              <span class="note" id="prevNote"></span>
            </div>
            <audio id="player" controls preload="none" hidden></audio>
            <p class="note" id="prevHint" hidden data-i18n="prev.hint"></p>
            <div class="meters" id="meters"></div>
            <div class="room-viz" id="roomViz"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="sec.advanced"></h2>
        <div class="body adv" id="adv"></div>
      </div>

      <div class="card">
        <h2 data-i18n="sec.cover"></h2>
        <div class="body">
          <div class="row">
            <input type="search" id="coverQ" data-i18n-ph="cover.ph">
            <button class="btn" id="coverSearch" data-i18n="cover.search"></button>
            <button class="btn" id="coverUploadBtn" data-i18n="cover.upload"></button>
            <input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp" hidden>
          </div>
          <p class="note" id="coverNote" data-i18n="cover.note"></p>
          <p class="note" data-i18n="cover.legal"></p>
          <div class="cover-sel" id="coverSel" hidden>
            <img id="coverImg" alt="">
            <div>
              <div><b data-i18n="cover.selected"></b></div>
              <div class="note" id="coverDim"></div>
              <div class="note" id="coverFmt"></div>
              <button class="btn sm" id="coverRemove" style="margin-top:8px" data-i18n="cover.remove"></button>
            </div>
          </div>
          <div class="note" id="coverStatus"></div>
          <div class="covers" id="covers"></div>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="sec.dest"></h2>
        <div class="body">
          <p class="note" id="roNote" hidden data-i18n="dest.roNote"></p>
          <label class="f" data-i18n="dest.folder"></label>
          <div class="row"><input type="text" id="outdir" readonly><button class="btn" id="pickDir" data-i18n="dest.browse"></button></div>
          <label class="f" for="outname" data-i18n="dest.name"></label>
          <div class="row"><input type="text" id="outname">
            <button class="btn sm" id="nameOrig" data-i18n="dest.nameOrig"></button>
            <button class="btn sm" id="nameSuffix">+ _DD-5_1</button></div>
          <label class="chk"><input type="checkbox" id="keepOrig" checked><span data-i18n="dest.keepOrig"></span></label>
          <div class="box warnbox" id="existsBox" hidden>
            <div id="existsText"></div>
            <label class="chk" id="backupRow"><input type="checkbox" id="backup" checked><span data-i18n="dest.backup"></span></label>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn pri" id="goBtn" data-i18n="dest.go"></button>
            <span class="note" id="goNote"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span data-i18n="sec.jobs"></span><span class="sp"></span><button class="btn sm" id="clearJobs" data-i18n="jobs.clear"></button></h2>
      <div id="jobs"></div>
    </div>
  </section>
</main>

<!-- selettore cartella -->
<dialog id="dirDlg">
  <p class="dh" data-i18n="dlg.dir.title"></p>
  <div class="crumbs" id="dCrumbs"></div>
  <div class="list" id="dList"></div>
  <footer><button class="btn" id="dCancel" data-i18n="btn.cancel"></button><button class="btn pri" id="dOk" data-i18n="dlg.dir.ok"></button></footer>
</dialog>

<!-- menu dei file -->
<div class="fmenu" id="fmenu" hidden>
  <button data-a="rename">&#9999;&#65039; <span data-i18n="fop.rename"></span></button>
  <button data-a="copy">&#128196; <span data-i18n="fop.copy"></span></button>
  <button data-a="move">&#128230; <span data-i18n="fop.move"></span></button>
  <hr>
  <button data-a="delete" class="del">&#128465;&#65039; <span data-i18n="fop.delete"></span></button>
</div>

<!-- dialogo operazioni sui file -->
<dialog id="fopDlg">
  <p class="dh" id="fopTitle"></p>
  <div class="body">
    <div id="fopDirRow">
      <label class="f" style="margin-top:0" data-i18n="fop.folder"></label>
      <div class="row"><input type="text" id="fopDir" readonly><button class="btn" id="fopBrowse" data-i18n="dest.browse"></button></div>
    </div>
    <div id="fopNameRow">
      <label class="f" for="fopName" data-i18n="fop.name"></label>
      <input type="text" id="fopName">
    </div>
    <p id="fopText" style="margin:0"></p>
    <p class="note err" id="fopErr"></p>
  </div>
  <footer><button class="btn" id="fopCancel" data-i18n="btn.cancel"></button><button class="btn pri" id="fopOk">OK</button></footer>
</dialog>

<!-- conferma sovrascrittura -->
<dialog id="owDlg">
  <p class="dh"><span style="color:var(--warn)">⚠</span> <span data-i18n="ow.title"></span></p>
  <div class="body">
    <p id="owText" style="margin-top:0"></p>
    <p id="owBackup" class="note"></p>
  </div>
  <footer><button class="btn" id="owCancel" data-i18n="btn.cancel"></button><button class="btn danger" id="owOk">OK</button></footer>
</dialog>

<!-- avviso all'attivazione della sovrascrittura -->
<dialog id="owOnDlg">
  <p class="dh"><span style="color:var(--err)">⚠</span> <span data-i18n="owon.title"></span></p>
  <div class="body">
    <p style="margin-top:0" data-i18n="owon.intro"></p>
    <ul style="margin:0 0 10px;padding-left:20px;line-height:1.5">
      <li data-i18n="owon.r1"></li>
      <li data-i18n="owon.r2"></li>
      <li data-i18n="owon.r3"></li>
      <li data-i18n="owon.r4"></li>
    </ul>
    <p class="note" data-i18n="owon.safe"></p>
    <p style="margin-bottom:0"><b data-i18n="owon.ask"></b></p>
  </div>
  <footer><button class="btn" id="owOnCancel" data-i18n="btn.cancel"></button><button class="btn danger" id="owOnOk">OK</button></footer>
</dialog>

<!-- impostazioni -->
<dialog id="setDlg">
  <p class="dh" data-i18n="set.title"></p>
  <div class="body">
    <label class="f" style="margin-top:0" data-i18n="set.theme"></label>
    <div class="seg" id="themeSeg">
      <button data-v="auto" data-i18n="set.theme.auto"></button>
      <button data-v="light" data-i18n="set.theme.light"></button>
      <button data-v="dark" data-i18n="set.theme.dark"></button>
    </div>
    <label class="f" for="langSel" data-i18n="set.lang"></label>
    <select id="langSel">
      <option value="it">Italiano</option><option value="en">English</option><option value="fr">Français</option>
      <option value="es">Español</option><option value="de">Deutsch</option>
    </select>
    <label class="f" data-i18n="set.files"></label>
    <label class="switch"><input type="checkbox" id="owSwitch"><span><span data-i18n="set.overwrite"></span>
      <span class="note" style="display:block" data-i18n="set.overwriteNote"></span></span></label>
    <label class="f" style="margin-top:18px" data-i18n="set.folders"></label>
    <div class="box" id="rootList" style="margin-top:0;padding:6px 12px"></div>
    <p class="note" data-i18n="set.foldersNote"></p>
    <p class="note" id="verNote" style="margin-top:16px"></p>
    <p class="note" style="font-size:12px" data-i18n="set.legal"></p>
  </div>
  <footer><button class="btn pri" id="setClose" data-i18n="btn.close"></button></footer>
</dialog>
<div class="toast" id="toast"></div>

const $ = s => document.querySelector(s);
const store = { get(k, d){ try { const v = localStorage.getItem('upmix.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem('upmix.'+k, JSON.stringify(v)); } catch(e){} } };
let LANG = store.get('lang', (navigator.language || 'it').slice(0,2));
if (!I18N[LANG]) LANG = 'it';
const t = (k, p) => { let s = (I18N[LANG] && I18N[LANG][k]) ?? I18N.it[k] ?? k; if (p) for (const [a,b] of Object.entries(p)) s = s.split('{'+a+'}').join(b); return s; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function errText(j){
  if (!j || !j.error) return t('err.internal', {detail:'?'});
  const p = {...(j.params || {})};
  if (p.reason) p.reason = t('reason.'+p.reason);
  return t('err.'+j.error, p);
}
function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
}

/* ===================================================== utilità */
class ApiErr extends Error { constructor(j){ super(errText(j)); this.code = j && j.error; } }
const api = async (url, opt) => {
  const init = opt && opt.body !== undefined ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(opt.body)} : opt;
  const r = await fetch(url, init);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new ApiErr(j);
  return j;
};
const toast = (m) => { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 3500); };
const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : b > 1e6 ? (b/1e6).toFixed(0)+' MB' : (b/1e3).toFixed(0)+' KB';
const fmtTime = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(x).padStart(2,'0'); };
const fmtDb = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + ' dB';

/* ===================================================== tema */
function applyTheme(){
  const th = store.get('theme', 'auto');
  if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === th));
}
applyTheme();

/* ===================================================== stato */

             {k:'sl',tag:'SL',area:'sl'}, {k:'lfe',tag:'LFE',area:'lfe'}, {k:'sr',tag:'SR',area:'sr'} ];

  {k:'master', min:-12, max:12, step:0.5, u:'dB'}, {k:'delay', min:0, max:40, step:1, u:' ms'},
  {k:'shelf', min:-10, max:4, step:0.5, u:'dB'}, {k:'lfe_cut', min:60, max:200, step:5, u:' Hz'}, {k:'smooth', min:0, max:1, step:0.05, u:'%'} ];
let ROOTS = [];

/* ===================================================== impostazioni */

function confirmEnableOverwrite(){

/* ===================================================== browser file */
async function loadDir(path){
  let d;
  try { d = await api('/api/list?path='+encodeURIComponent(path)); } catch(e){ if (path) return loadDir(''); toast(e.message); return; }
  S.dir = d.path; store.set('dir', d.path);
  renderCrumbs($('#crumbs'), d.path, loadDir);
  const L = $('#list'); L.innerHTML = '';
  if (d.path) L.append(row('dir', '..', '', () => loadDir(d.parent)));
  if (!d.entries.length) L.insertAdjacentHTML('beforeend', `<div class="empty">${t('list.empty')}</div>`);
  for (const e of d.entries){
    const tag = !d.path ? t(e.writable ? 'root.rw' : 'root.ro') : (e.size ? fmtSize(e.size) : '');
    const r = row(e.type, e.name, tag, () => e.type === 'dir' ? loadDir(e.path) : selectFile(e, r),
                  (d.writable && e.type !== 'dir') ? e : null);
    if (S.file && S.file.path === e.path) r.classList.add('sel');
    L.append(r);
  }
}
function row(type, name, size, onclick, entry){
  const r = document.createElement('div'); r.className = 'item';
  r.innerHTML = `<span class="ic">${type==='dir'?'📁':type==='video'?'🎬':'🎵'}</span><span class="nm" title="${esc(name)}">${esc(name)}</span><span class="sz">${esc(size)}</span>`;
  r.onclick = onclick;
  if (entry){
    const b = document.createElement('button'); b.className = 'more'; b.type = 'button'; b.textContent = '\u22EE';
    b.title = t('fop.actions'); b.setAttribute('aria-label', t('fop.actions'));
    b.onclick = ev => { ev.stopPropagation(); openFileMenu(b, entry); };
    r.append(b);
  }
  return r;
}
function renderCrumbs(el, path, go){
  el.innerHTML = '';
  const a = (txt, p) => { const x = document.createElement('a'); x.textContent = txt; x.onclick = () => go(p); return x; };
  el.append(a(t('crumb.root'), ''));
  if (!path) return;
  const root = ROOTS.filter(r => path === r.path || path.startsWith(r.path + '/')).sort((x,y)=>y.path.length-x.path.length)[0];
  if (!root) return;
  el.append(sep(), a(root.name, root.path));
  let cur = root.path;
  for (const part of path.slice(root.path.length).split('/').filter(Boolean)){ cur += '/' + part; el.append(sep(), a(part, cur)); }
}
const sep = () => { const s = document.createElement('span'); s.textContent = '›'; return s; };
const writableRoots = () => ROOTS.filter(r => r.writable);
const inWritable = p => writableRoots().some(r => p === r.path || p.startsWith(r.path + '/'));

/* ===================================================== file scelto */
async function selectFile(e, rowEl){
  document.querySelectorAll('#list .item.sel').forEach(x => x.classList.remove('sel'));
  rowEl && rowEl.classList.add('sel');
  $('#noFile').hidden = true; $('#panel').hidden = false;
  $('#info').innerHTML = `<dt>${t('info.analyzing')}</dt><dd><span class="spin"></span></dd>`;
  let info;
  try { info = await api('/api/info?path='+encodeURIComponent(e.path)); }
  catch(err){ $('#info').innerHTML = `<dt>${t('info.error')}</dt><dd class="err">${esc(err.message)}</dd>`; return; }
  S.file = e; S.info = info;
  renderInfo();
  const first = info.audio.findIndex(a => a.channels === 2);
  renderTracks(first >= 0 ? first : 0);
  const st = $('#start'); st.max = Math.max(0, Math.floor(info.duration - 30)); st.value = Math.floor(st.max/3); $('#startV').textContent = fmtTime(st.value);
  $('#player').hidden = true; $('#prevHint').hidden = true; $('#meters').innerHTML = ''; $('#prevNote').textContent = '';
  updateFrame();
  // destinazione predefinita
  const srcDir = e.path.slice(0, e.path.lastIndexOf('/'));
  const last = store.get('outdir', '');
  const wr = writableRoots();
  $('#outdir').value = inWritable(srcDir) ? srcDir : (inWritable(last) ? last : (wr[0] ? wr[0].path : ''));
  $('#roNote').hidden = inWritable(srcDir);
  // copertina: azzera e prepara la ricerca
  S.cover = null; $('#covers').innerHTML = ''; $('#coverStatus').textContent = '';
  $('#coverQ').value = guessQuery(e.name, info.title);
  renderCoverSel();
  setName(store.get('nameMode','suffix'));
}
function renderInfo(){
  const info = S.info, v = info.video[0];
  $('#info').innerHTML = `
    <dt>${t('info.name')}</dt><dd>${esc(S.file.name)}</dd>
    <dt>${t('info.duration')}</dt><dd>${fmtTime(info.duration)} · ${fmtSize(info.size)}</dd>
    <dt>${t('info.video')}</dt><dd>${v ? `${esc(v.codec)} ${v.width}×${v.height}` : '—'}</dd>
    <dt>${t('info.subs')}</dt><dd>${info.subtitles || t('info.none')}</dd>
    <dt>${t('info.cover')}</dt><dd>${t(info.has_cover ? 'info.yes' : 'info.no')}</dd>`;
}
function renderTracks(sel){
  const T = $('#track'); T.innerHTML = '';
  for (const a of S.info.audio){
    const o = document.createElement('option'); o.value = a.index;
    o.textContent = `#${a.index+1} · ${a.codec} · ${t('track.channels',{n:a.channels})}${a.layout?' ('+a.layout+')':''}${a.lang?' · '+a.lang:''}${a.title?' · '+a.title:''}${a.channels!==2?' — '+t('track.notStereo'):''}`;
    T.append(o);
  }
  T.value = sel; onTrack();
}
function onTrack(){
  if (!S.info.audio.length){ $('#trackNote').innerHTML = `<span class="err">${t('track.noAudio')}</span>`; $('#goBtn').disabled = $('#prevBtn').disabled = true; return; }
  const a = S.info.audio[+$('#track').value], ok = a && a.channels === 2;
  $('#trackNote').innerHTML = ok ? '' : `<span class="warn">${t('track.warn')}</span>`;
  $('#prevBtn').disabled = !ok; checkDest();
}
$('#track').onchange = onTrack;
$('#start').oninput = e => { $('#startV').textContent = fmtTime(e.target.value); updateFrame(); };

function setName(mode){
  if (!S.file) return;
  store.set('nameMode', mode);
  const n = S.file.name, dot = n.lastIndexOf('.'), base = dot > 0 ? n.slice(0, dot) : n;
  const srcExt = dot > 0 ? n.slice(dot+1).toLowerCase() : '';
  let ext = srcExt || 'mkv';
  if (!S.info.video.length) ext = 'mka';
  else if (['wmv','webm'].includes(ext)) ext = 'mkv';
  $('#outname').value = (mode === 'orig' && ext === srcExt) ? n : (mode === 'orig' ? `${base}.${ext}` : `${base}_DD-5_1.${ext}`);
  checkDest();
}
$('#nameOrig').onclick = () => setName('orig');
$('#nameSuffix').onclick = () => setName('suffix');
$('#outname').oninput = () => { checkDest(); renderCoverSel(); };

let existsTimer;
function checkDest(){
  if (!S.file) return;
  const name = $('#outname').value.trim(), dir = $('#outdir').value, full = dir + '/' + name;
  S.same = full === S.file.path;
  clearTimeout(existsTimer);
  existsTimer = setTimeout(async () => {
    let exists = S.same;
    if (!exists && dir){
      try { const d = await api('/api/list?path='+encodeURIComponent(dir)); exists = d.entries.some(x => x.path === full); } catch(e){}
    }
    S.exists = exists;
    const box = $('#existsBox');
    box.hidden = !exists;
    if (exists){
      if (S.settings.allow_overwrite){
        $('#existsText').innerHTML = t(S.same ? 'dest.replace' : 'dest.exists');
        $('#backupRow').hidden = false;
      } else {
        $('#existsText').innerHTML = `<span class="err">${t('dest.owOff')}</span>`;
        $('#backupRow').hidden = true;
      }
    }
    const a = S.info.audio[+$('#track').value];
    $('#goBtn').disabled = !(a && a.channels === 2) || !dir || (exists && !S.settings.allow_overwrite);
    renderCoverSel();
  }, 200);
}

/* ===================================================== canali */
function buildSpeakers(){
  const g = $('#spk'); g.innerHTML = '';
  for (const c of CH){
    const d = document.createElement('div'); d.className = 'spk'; d.style.gridArea = c.area;
    d.innerHTML = `<div class="tag">${c.tag}</div><div class="val" id="v_${c.k}"></div>
      <input class="vs" type="range" min="-24" max="6" step="0.5" id="s_${c.k}" aria-label="${esc(t('ch.'+c.k))}">
      <div class="lbl">${t('ch.'+c.k)}</div>`;
    g.append(d);
    d.querySelector('input').oninput = ev => {
      const v = +ev.target.value; S.params[c.k] = v;
      const pair = {fl:'fr', fr:'fl', sl:'sr', sr:'sl'}[c.k];
      if (pair && ((c.k[0]==='f' && $('#linkF').checked) || (c.k[0]==='s' && $('#linkS').checked))) S.params[pair] = v;
      paint(); saveParams();
    };
  }
  const a = $('#adv'); a.innerHTML = '';
  for (const x of ADV)
    a.insertAdjacentHTML('beforeend', `<div class="hs"><label>${t('adv.'+x.k)} <b id="v_${x.k}"></b></label><input type="range" id="s_${x.k}" min="${x.min}" max="${x.max}" step="${x.step}"></div>`);
  a.insertAdjacentHTML('beforeend', `<div><label class="chk" style="margin-top:22px"><input type="checkbox" id="s_limiter"><span>${t('adv.limiter')}</span></label>
    <label class="f" for="s_bitrate">${t('adv.bitrate')}</label><select id="s_bitrate"><option value="448">448 kbit/s</option><option value="640">640 kbit/s (${t('adv.max')})</option></select></div>`);
  for (const x of ADV) $('#s_'+x.k).oninput = ev => { S.params[x.k] = +ev.target.value; paint(); saveParams(); };
  $('#s_limiter').onchange = ev => { S.params.limiter = ev.target.checked; saveParams(); };
  $('#s_bitrate').onchange = ev => { S.params.bitrate = +ev.target.value; saveParams(); };
}
function paint(){
  if (!S.params) return;
  for (const c of CH){ $('#s_'+c.k).value = S.params[c.k]; $('#v_'+c.k).textContent = fmtDb(S.params[c.k]); }
  for (const x of ADV){
    $('#s_'+x.k).value = S.params[x.k];
    $('#v_'+x.k).textContent = x.u === 'dB' ? fmtDb(S.params[x.k]) : x.u === '%' ? Math.round(S.params[x.k]*100)+'%' : S.params[x.k] + x.u;
  }
  $('#s_limiter').checked = !!S.params.limiter; $('#s_bitrate').value = S.params.bitrate;
  updateRoom();
}
const saveParams = () => store.set('params', S.params);

/* ===================================================== pianta della stanza 5.1 */
// vista dall'alto: posizioni standard ITU-R BS.775 (frontali ±30°, surround ±110°)
const ROOM = (() => {
  const L = {x:220, y:300}, R = 170, rad = a => a * Math.PI / 180;
  const at = a => ({x: L.x + R * Math.sin(rad(a)), y: L.y - R * Math.cos(rad(a))});
  return { L, R, spk: {
    fc: {...at(0),   w:56, h:18, kind:'center'},
    fl: {...at(-30), w:24, h:40, kind:'tower', ang:'30°',  angDx:-34},
    fr: {...at(30),  w:24, h:40, kind:'tower', ang:'30°',  angDx:34},
    sl: {...at(-110),w:20, h:30, kind:'sat',   ang:'110°', angDx:0},
    sr: {...at(110), w:20, h:30, kind:'sat',   ang:'110°', angDx:0},
    lfe:{x:392, y:214, w:34, h:34, kind:'sub'} } };
})();
const svgNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent){ const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; }
function buildRoom(){
  const box = $('#roomViz'); box.innerHTML = '';
  const svg = sv('svg', {viewBox:'0 0 440 446', role:'img', 'aria-label':'5.1'}, box);
  sv('rect', {x:4, y:4, width:432, height:438, rx:18, class:'rv-floor'}, svg);
  sv('circle', {cx:ROOM.L.x, cy:ROOM.L.y, r:ROOM.R, class:'rv-ring'}, svg);
  // fasci sonori (sotto le casse)
  const beams = sv('g', {}, svg);
  for (const [k, s] of Object.entries(ROOM.spk)){
    const dx = ROOM.L.x - s.x, dy = ROOM.L.y - s.y, len = Math.hypot(dx, dy), ux = dx/len, uy = dy/len, px = -uy, py = ux, w = 24;
    const pts = [[s.x, s.y], [ROOM.L.x + px*w - ux*6, ROOM.L.y + py*w - uy*6], [ROOM.L.x - px*w - ux*6, ROOM.L.y - py*w - uy*6]];
    sv('polygon', {points: pts.map(p => p.join(',')).join(' '), class:'rv-beam', id:'rvb_'+k}, beams);
  }
  // TV vista di fronte (16:9) con un fotogramma del file
  const tv = {x:144, y:16, w:152, h:86};
  sv('rect', {x:tv.x-5, y:tv.y-5, width:tv.w+10, height:tv.h+10, rx:6, class:'rv-tv'}, svg);
  sv('rect', {x:tv.x, y:tv.y, width:tv.w, height:tv.h, fill:'#000'}, svg);
  const clip = sv('clipPath', {id:'rvTvClip'}, sv('defs', {}, svg));
  sv('rect', {x:tv.x, y:tv.y, width:tv.w, height:tv.h}, clip);
  sv('image', {id:'rvFrame', x:tv.x, y:tv.y, width:tv.w, height:tv.h, preserveAspectRatio:'xMidYMid meet', 'clip-path':'url(#rvTvClip)'}, svg);
  sv('rect', {x:tv.x+tv.w/2-14, y:tv.y+tv.h+5, width:28, height:4, rx:2, class:'rv-tv'}, svg);
  // divano e posizione d'ascolto
  sv('rect', {x:162, y:314, width:116, height:16, rx:7, class:'rv-sofa'}, svg);
  sv('rect', {x:168, y:300, width:104, height:22, rx:8, class:'rv-sofa'}, svg);
  sv('circle', {cx:ROOM.L.x, cy:ROOM.L.y, r:8, class:'rv-head'}, svg);
  sv('text', {x:ROOM.L.x, y:350, class:'rv-lbl'}, svg).textContent = t('room.listener');
  updateFrame();
  // casse
  for (const [k, s] of Object.entries(ROOM.spk)){
    const g = sv('g', {transform:`translate(${s.x.toFixed(1)},${s.y.toFixed(1)})`}, svg);
    sv('title', {}, g).textContent = t('ch.'+k);
    sv('rect', {x:-s.w/2, y:-s.h/2, width:s.w, height:s.h, rx: s.kind === 'sub' ? 6 : 4, class:'rv-body'}, g);
    const drv = { tower:[[0,-10,4.5],[0,7,7]], center:[[-17,0,5.5],[0,0,3],[17,0,5.5]], sat:[[0,-6,3.5],[0,6,5]], sub:[[0,0,11]] }[s.kind];
    for (const [cx, cy, r] of drv) sv('circle', {cx, cy, r, class:'rv-drv', 'data-k':k}, g);
    // etichetta con il valore
    const py = s.h/2 + 17;
    sv('rect', {x:-40, y:py-12, width:80, height:24, rx:12, class:'rv-pill', id:'rvp_'+k}, g);
    sv('text', {x:-24, y:py, class:'rv-tag'}, g).textContent = CH.find(c => c.k === k).tag;
    sv('text', {x:10, y:py, class:'rv-val', id:'rvv_'+k}, g);
    if (s.ang) sv('text', {x:s.angDx, y:-s.h/2 - 8, class:'rv-ang'}, g).textContent = s.ang;
  }
  updateRoom();
}
// fotogramma sulla TV: stesso punto scelto per l'anteprima
let frameTimer;
function updateFrame(){
  const img = $('#rvFrame'); if (!img) return;
  clearTimeout(frameTimer);
  if (!S.file){ img.removeAttribute('href'); return; }
  frameTimer = setTimeout(() => {
    const url = `/api/thumb?path=${encodeURIComponent(S.file.path)}&t=${Math.floor(+$('#start').value || 0)}`;
    const pre = new Image();
    pre.onload = () => img.setAttribute('href', url);
    pre.onerror = () => img.removeAttribute('href');
    pre.src = url;
  }, 250);
}
function updateRoom(){
  if (!S.params || !$('#rvv_fl')) return;
  for (const k of Object.keys(ROOM.spk)){
    const db = +S.params[k], lvl = Math.max(0, Math.min(1, (db + 24) / 30)), on = db > -23.5;
    $('#rvv_'+k).textContent = fmtDb(db);
    $('#rvb_'+k).style.opacity = on ? (0.05 + 0.42 * lvl * (k === 'lfe' ? 0.6 : 1)).toFixed(3) : 0;
    $('#rvp_'+k).classList.toggle('low', !on);
    document.querySelectorAll(`.rv-drv[data-k="${k}"]`).forEach(c => c.classList.toggle('on', on));
  }
}

/* ===================================================== preset */
async function loadPresets(selected){ S.presets = await api('/api/presets'); renderPresetSelect(selected); }
function renderPresetSelect(selected){
  const P = $('#preset'); P.innerHTML = '';
  const add = (label, obj, prefix, nameOf) => { const og = document.createElement('optgroup'); og.label = label;
    for (const n of Object.keys(obj)){ const o = document.createElement('option'); o.value = prefix+n; o.textContent = nameOf(n); og.append(o); }
    if (og.children.length) P.append(og); };
  add(t('preset.builtin'), S.presets.builtin, 'b:', n => t('preset.'+n));
  add(t('preset.user'), S.presets.user, 'u:', n => n);
  P.value = selected || store.get('preset', 'b:stalls');
  if (!P.value) P.value = 'b:stalls';
  $('#delPresetBtn').hidden = !P.value.startsWith('u:');
}
const presetParams = id => { const i = id.indexOf(':'), ty = id.slice(0,i), name = id.slice(i+1);
  return {...S.presets.defaults, ...((ty==='b' ? S.presets.builtin : S.presets.user)[name] || {})}; };
$('#preset').onchange = () => { store.set('preset', $('#preset').value); S.params = presetParams($('#preset').value); paint(); saveParams(); $('#delPresetBtn').hidden = !$('#preset').value.startsWith('u:'); };
$('#resetBtn').onclick = () => { S.params = presetParams($('#preset').value); paint(); saveParams(); toast(t('toast.presetReset')); };
$('#savePresetBtn').onclick = async () => {
  const n = prompt(t('prompt.presetName')); if (!n || !n.trim()) return;
  try { await api('/api/presets', {body:{name:n, params:S.params}}); await loadPresets('u:'+n.trim().slice(0,60)); store.set('preset', $('#preset').value); toast(t('toast.presetSaved')); }
  catch(e){ toast(e.message); }
};
$('#delPresetBtn').onclick = async () => {
  const id = $('#preset').value; if (!id.startsWith('u:') || !confirm(t('confirm.delPreset', {name:id.slice(2)}))) return;
  try { await api('/api/presets', {body:{name:id.slice(2), params:null}}); await loadPresets('b:stalls'); store.set('preset', $('#preset').value); toast(t('toast.presetDeleted')); }
  catch(e){ toast(e.message); }
};

/* ===================================================== anteprima */
$('#prevBtn').onclick = async () => {
  const b = $('#prevBtn'); b.disabled = true; $('#prevNote').innerHTML = `<span class="spin"></span> ${t('prev.working')}`;
  try {
    const r = await api('/api/preview', {body:{path:S.file.path, track:+$('#track').value, params:S.params, start:+$('#start').value}});
    const p = $('#player'); p.src = r.url; p.hidden = false; $('#prevHint').hidden = false; p.play().catch(()=>{});
    drawMeters(r.levels); $('#prevNote').textContent = '';
  } catch(e){ $('#prevNote').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  b.disabled = false;
};
function drawMeters(levels){
  const M = $('#meters'); M.innerHTML = '';
  const h = v => Math.max(0, Math.min(100, (v + 60) / 60 * 100));
  const short = {FL:'L', FR:'R', FC:'C'};
  for (const l of levels){
    const pk = l.peak ?? -120, rm = l.rms ?? -120;
    M.insertAdjacentHTML('beforeend', `<div class="mt"><div class="bar" title="RMS ${rm} dB · peak ${pk} dB">
      <div class="r" style="height:${h(rm)}%;${pk > -1 ? 'background:var(--meter-clip)' : ''}"></div>
      <div class="p" style="bottom:${h(pk)}%"></div></div>
      <div class="n">${short[l.ch] || l.ch}</div><div class="d">${rm <= -119 ? '—' : rm.toFixed(0)}</div></div>`);
  }
  M.insertAdjacentHTML('beforeend', `<p class="note" style="grid-column:1/-1;margin:0">${t('prev.legend')}</p>`);
}

/* ===================================================== copertina */
function guessQuery(name, title){
  let s = (title && title.length > 2) ? title : name.replace(/\.[^.]+$/, '');
  s = s.replace(/_DD-5_1/gi, ' ').replace(/\[[^\]]*\]/g, ' ').replace(/\((?:\d{4}|[^)]*(?:1080|720|480|dvd|bd|bluray|rip)[^)]*)\)/gi, ' ')
       .replace(/\b(1080p|720p|480p|x264|x265|h264|hevc|dvdrip|bdrip|bluray|web-?dl|ac3|dts|aac|5\.1|2\.0)\b/gi, ' ')
       .replace(/[._]+/g, ' ').replace(/\s+-\s+/g, ' ').replace(/\s+/g, ' ').trim();
  return s;
}
const coverExtOk = () => ['mkv','mka','mp4','m4v','mov'].includes(($('#outname').value.split('.').pop() || '').toLowerCase());
function renderCoverSel(){
  const has = !!S.cover;
  $('#coverSel').hidden = !has;
  if (!has) return;
  $('#coverImg').src = S.cover.url;
  $('#coverDim').textContent = S.cover.width ? `${S.cover.width}×${S.cover.height} px` : '';
  const ext = ($('#outname').value.split('.').pop() || '').toLowerCase();
  $('#coverFmt').innerHTML = coverExtOk() ? `<span class="ok">${t('cover.fmtOk')}</span>${S.info && S.info.has_cover ? ' '+t('cover.replaces') : ''}`
                                          : `<span class="warn">${t('cover.fmtNo', {ext})}</span>`;
}
$('#coverSearch').onclick = searchCovers;
$('#coverQ').onkeydown = e => { if (e.key === 'Enter') searchCovers(); };
async function searchCovers(){
  const q = $('#coverQ').value.trim();
  $('#coverStatus').innerHTML = `<span class="spin"></span> ${t('cover.searching')}`; $('#covers').innerHTML = '';
  let res;
  try { res = await api('/api/cover/search?q='+encodeURIComponent(q)); } catch(e){ $('#coverStatus').innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  $('#coverStatus').textContent = res.length ? t('cover.results', {n: res.length}) : t('cover.none');
  const C = $('#covers');
  for (const r of res){
    const b = document.createElement('button'); b.className = 'cv'; b.type = 'button';
    b.innerHTML = `<img loading="lazy" alt="" referrerpolicy="no-referrer"><div class="ti"></div><div class="ar"></div><div class="src"></div>`;
    const img = b.querySelector('img'); img.src = r.thumb; img.onerror = () => b.remove();
    b.querySelector('.ti').textContent = r.title;
    b.querySelector('.ar').textContent = [r.artist, r.year].filter(Boolean).join(' · ');
    b.querySelector('.src').textContent = r.source + (r.size ? ' · ' + r.size : '');
    b.onclick = () => pickCover(r, b);
    C.append(b);
  }
}
async function pickCover(r, el){
  document.querySelectorAll('.cv.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel');
  $('#coverStatus').innerHTML = `<span class="spin"></span> ${t('cover.downloading')}`;
  try { S.cover = await api('/api/cover/select', {body:{id:r.id}}); $('#coverStatus').textContent = ''; renderCoverSel(); }
  catch(e){ el.classList.remove('sel'); $('#coverStatus').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
$('#coverUploadBtn').onclick = () => $('#coverFile').click();
$('#coverFile').onchange = async () => {
  const f = $('#coverFile').files[0]; if (!f) return;
  $('#coverStatus').innerHTML = `<span class="spin"></span>`;
  try {
    const r = await fetch('/api/cover/upload', {method:'POST', headers:{'Content-Type': f.type || 'application/octet-stream'}, body: f});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new ApiErr(j);
    S.cover = j; document.querySelectorAll('.cv.sel').forEach(x => x.classList.remove('sel'));
    $('#coverStatus').textContent = ''; renderCoverSel();
  } catch(e){ $('#coverStatus').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  $('#coverFile').value = '';
};
$('#coverRemove').onclick = () => { S.cover = null; document.querySelectorAll('.cv.sel').forEach(x => x.classList.remove('sel')); renderCoverSel(); };

/* ===================================================== destinazione */
let dSel = '';
let dirCb = null;
function openDirPicker(start, cb){ dirCb = cb; dSel = start; loadDDir(start); $('#dirDlg').showModal(); }
$('#pickDir').onclick = () => openDirPicker($('#outdir').value, v => { $('#outdir').value = v; store.set('outdir', v); checkDest(); });
$('#dCancel').onclick = () => $('#dirDlg').close();
$('#dOk').onclick = () => { if (!dSel){ toast(t('toast.pickDir')); return; } $('#dirDlg').close(); if (dirCb) dirCb(dSel); };
async function loadDDir(path){
  let d; try { d = await api('/api/list?dirs=1&path='+encodeURIComponent(path)); } catch(e){ if (path) return loadDDir(''); toast(e.message); return; }
  dSel = d.path; renderCrumbs($('#dCrumbs'), d.path, loadDDir);
  const L = $('#dList'); L.innerHTML = '';
  if (d.path) L.append(row('dir', '..', '', () => loadDDir(d.parent)));
  for (const e of d.entries) L.append(row('dir', e.name, '', () => loadDDir(e.path)));
  if (!d.entries.length) L.insertAdjacentHTML('beforeend', `<div class="empty">${t('dlg.dir.empty')}</div>`);
}

/* ===================================================== operazioni sui file */
let menuEntry = null, menuBtn = null;
function openFileMenu(btn, entry){
  const m = $('#fmenu');
  if (menuBtn === btn && !m.hidden){ closeFileMenu(); return; }
  closeFileMenu(); menuEntry = entry; menuBtn = btn; btn.classList.add('on');
  m.hidden = false;
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
  m.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
}
function closeFileMenu(){ $('#fmenu').hidden = true; if (menuBtn) menuBtn.classList.remove('on'); menuBtn = null; }
document.addEventListener('click', e => { if (!e.target.closest('#fmenu') && !e.target.closest('.more')) closeFileMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFileMenu(); });
window.addEventListener('scroll', closeFileMenu, true);
window.addEventListener('resize', closeFileMenu);
document.querySelectorAll('#fmenu button').forEach(b => b.onclick = () => { const e = menuEntry; closeFileMenu(); fileAction(b.dataset.a, e); });

function fileAction(kind, e){
  const dlg = $('#fopDlg'), dir = e.path.slice(0, e.path.lastIndexOf('/'));
  $('#fopTitle').textContent = t('fop.'+kind) + ' \u2014 ' + e.name;
  $('#fopDirRow').hidden = !(kind === 'copy' || kind === 'move');
  $('#fopNameRow').hidden = kind === 'delete';
  $('#fopDir').value = dir;
  $('#fopName').value = e.name;
  $('#fopText').innerHTML = kind === 'delete' ? `<span class="err">${esc(t('fop.delText', {name: e.name}))}</span>` : '';
  $('#fopErr').textContent = '';
  $('#fopOk').className = 'btn ' + (kind === 'delete' ? 'danger' : 'pri');
  $('#fopBrowse').onclick = () => openDirPicker($('#fopDir').value, v => { $('#fopDir').value = v; });
  $('#fopCancel').onclick = () => dlg.close();
  $('#fopOk').onclick = async () => {
    const body = {path: e.path, name: $('#fopName').value.trim(), destdir: $('#fopDir').value};
    $('#fopOk').disabled = true; $('#fopErr').textContent = '';
    try {
      const r = await api('/api/file/' + kind, {body});
      dlg.close();
      toast(t(r.job ? 'toast.fopStarted' : 'toast.'+kind));
      if (S.file && S.file.path === e.path && kind !== 'copy') resetPanel();
      loadDir(S.dir); refreshJobs(); lastActive = true;
    } catch(err){ $('#fopErr').textContent = err.message; }
    $('#fopOk').disabled = false;
  };
  dlg.showModal();
  if (kind !== 'delete'){ const n = $('#fopName'); n.focus(); const dot = n.value.lastIndexOf('.'); n.setSelectionRange(0, dot > 0 ? dot : n.value.length); }
  else $('#fopCancel').focus();
}
function resetPanel(){ S.file = null; S.info = null; $('#panel').hidden = true; $('#noFile').hidden = false; }

/* ===================================================== avvio conversione */
function confirmOverwrite(name, same, backup){
  return new Promise(res => {
    $('#owText').textContent = t(same ? 'ow.replace' : 'ow.other', {name});
    $('#owBackup').innerHTML = backup ? t('ow.bkOn') : `<span class="err">${t('ow.bkOff')}</span>`;
    const dlg = $('#owDlg');
    const done = v => { dlg.close(); $('#owOk').onclick = $('#owCancel').onclick = null; dlg.oncancel = null; res(v); };
    $('#owOk').onclick = () => done(true); $('#owCancel').onclick = () => done(false); dlg.oncancel = e => { e.preventDefault(); done(false); };
    dlg.showModal(); $('#owCancel').focus();
  });
}
$('#goBtn').onclick = async () => {
  const body = { path:S.file.path, track:+$('#track').value, params:S.params, outdir:$('#outdir').value,
    outname:$('#outname').value.trim(), keep_original:$('#keepOrig').checked, backup:$('#backup').checked,
    cover_id: S.cover ? S.cover.cover_id : null, overwrite:false };
  if (S.exists){
    if (!S.settings.allow_overwrite) return;
    if (!await confirmOverwrite(body.outname, S.same, body.backup)) return;
    body.overwrite = true;
  }
  try { await api('/api/jobs', {body}); toast(t('toast.queued')); refreshJobs(); }
  catch(e){ $('#goNote').innerHTML = `<span class="err">${esc(e.message)}</span>`; setTimeout(()=>$('#goNote').textContent='', 7000); }
};

/* ===================================================== lavori */
async function refreshJobs(){
  let jobs; try { jobs = await api('/api/jobs'); } catch(e){ return; }
  const J = $('#jobs');
  if (!jobs.length){ J.innerHTML = `<div class="empty">${t('jobs.empty')}</div>`; return; }
  J.innerHTML = jobs.map(j => {
    const active = j.state === 'running' || j.state === 'queued';
    const extra = [];
    if (j.speed && j.state === 'running') extra.push(t('job.speed', {v: esc(j.speed)}));
    if (j.has_cover && j.state === 'done' && !(j.msgs||[]).includes('cover_skipped')) extra.push(t('job.cover'));
    const lines = [];
    if (j.backup_path) lines.push(t('job.backup', {p: esc(j.backup_path)}));
    for (const m of (j.msgs || [])) lines.push(t('msg.'+m));
    if (j.error) lines.push(`<span class="err">${esc(errText({error:j.error.code, params:j.error.params}))}</span>`);
    const label = j.kind ? `${t('job.kind.'+j.kind)}: ${esc(j.name)}` : esc(j.name);
    return `<div class="job"><div class="t"><span class="nm" title="${esc(j.src)}">${label}</span>
      <span class="badge ${j.state}">${t('state.'+j.state)}${j.state==='running'?' · '+j.progress.toFixed(0)+'%':''}</span>
      ${active ? `<button class="btn sm" data-c="${j.id}">${t('job.cancel')}</button>` : `<button class="btn sm" data-r="${j.id}" title="${esc(t('job.remove'))}">✕</button>`}</div>
      <div class="pb"><div style="width:${j.state==='done'?100:j.progress}%"></div></div>
      <div class="m">→ ${esc(j.dst)}${extra.length ? ' · '+extra.join(' · ') : ''}${lines.length ? '<br>'+lines.join('<br>') : ''}</div></div>`;
  }).join('');
  J.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => { await api(`/api/jobs/${b.dataset.c}/cancel`, {body:{}}); refreshJobs(); });
  J.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { await api(`/api/jobs/${b.dataset.r}/remove`, {body:{}}); refreshJobs(); });
}
$('#clearJobs').onclick = async () => {
  const jobs = await api('/api/jobs');
  for (const j of jobs) if (!['running','queued'].includes(j.state)) await api(`/api/jobs/${j.id}/remove`, {body:{}});
  refreshJobs();
};
let lastActive = false;
setInterval(async () => {
  const jobs = await api('/api/jobs').catch(() => []);
  const active = jobs.some(j => j.state === 'running' || j.state === 'queued');
  if (active || lastActive){ refreshJobs(); if (!active && S.dir) loadDir(S.dir); if (!active) checkDest(); }
  lastActive = active;
}, 2000);

/* ===================================================== avvio pagina */
(async () => {
  applyI18n();
  ROOTS = await api('/api/roots');
  $('#noWritable').hidden = writableRoots().length > 0;
  S.settings = await api('/api/settings').catch(() => S.settings);
  buildSpeakers();
  await loadPresets();
  S.params = {...presetParams($('#preset').value), ...store.get('params', {})};
  buildRoom();
  paint();
  await loadDir(store.get('dir', ''));
  refreshJobs();
})();
</script>
